<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品评论数统计报表</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>商品评论数统计报表</h1>
      <a href="index.html" class="nav-link">← 返回导入页</a>
    </div>

    <section class="section">
      <p class="report-intro">按商品评论数（ReviewCount）区间统计商品个数。</p>

      <div id="report-loading" class="loading">正在加载报表...</div>
      <div id="report-error" class="error-msg" style="display:none"></div>

      <div id="report-content" style="display:none">
        <div id="report-summary" class="summary-bar"></div>

        <!-- 柱形图 -->
        <div id="chart" class="chart" role="img" aria-label="商品评论数区间柱形图"></div>

        <!-- 数据表 -->
        <table id="report-table">
          <thead>
            <tr><th>评论数区间</th><th>商品个数</th><th>占比</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
  <script type="module" src="report.js"></script>
</body>
</html>
